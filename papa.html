<style>
:root{color-scheme:dark;--bg:#0b0614;--fg:#f4efe6}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
#c{display:block;position:absolute;left:0;top:0;background:#000;outline:none}
#pw{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:#1c1730;border:3px solid #f472b6;border-radius:16px;padding:22px 26px;text-align:center;z-index:5;min-width:300px}
#pw[hidden],#pad[hidden],#pmain[hidden],#plet[hidden]{display:none}
#pw h2{margin:0 0 6px;font-size:22px;color:#fde047}
#pw p{margin:0 0 12px;color:#cbd5e1;font-size:15px;max-width:360px}
#pw input{font-size:24px;padding:8px 12px;border-radius:10px;border:2px solid #475569;background:#0b0614;color:#fff;width:200px;text-align:center}
#pw button{font-size:20px;margin-left:8px;padding:8px 16px;border-radius:10px;border:0;background:#fde047;color:#0b0614;font-weight:800}
#pw #pwskip{display:block;margin:14px auto 0;background:#334155;color:#fff;font-size:16px}
#pwmsg{color:#fca5a5;min-height:1.2em;margin-top:10px;font-size:15px}
/* ---- telefono ---- */
body.padmode #c{display:none}
#pad{position:fixed;inset:0;display:flex;flex-direction:column;gap:8px;box-sizing:border-box;padding:max(8px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(10px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));
 touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;background:#16102a}
#pad header{display:flex;flex-direction:column;gap:2px}
#pad header b{font-size:18px;color:#f9a8d4}
#pad .st{font-size:13px;color:#a79fbc}#pad .st.ok{color:#4ade80}
#pad .diag{font:11px monospace;color:#6b6585}
#phint{min-height:1.2em;text-align:center;font-weight:900;font-size:18px;color:#fde047}
#pmain{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:space-evenly;gap:16px}
.dpad{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:8px;width:min(78vw,46vh);aspect-ratio:1;max-width:100%}
.dpad button{border-radius:18px;border:4px solid #a78bfa;background:#251c42;padding:0;display:flex;align-items:center;justify-content:center}
.dpad svg{width:58%;height:auto;fill:#c4b5fd}
.dpad .u{grid-column:2;grid-row:1}.dpad .l{grid-column:1;grid-row:2}.dpad .r{grid-column:3;grid-row:2}.dpad .d{grid-column:2;grid-row:3}
.dpad .mid{grid-column:2;grid-row:2;border-radius:50%;background:#1d1733}
.btns{display:flex;flex-direction:column;align-items:center;gap:12px;width:min(86vw,520px)}
.btns .ok{width:100%;height:min(17vh,120px);border-radius:28px;border:0;background:#fde047;color:#3b2a05;font:900 40px system-ui,sans-serif}
.btns .row2{display:flex;gap:12px;width:100%}
.btns .row2 button{flex:1;height:min(10vh,70px);border-radius:18px;border:3px solid #475569;background:#221b38;color:#fff;font:800 20px system-ui,sans-serif}
.btns .map{border-color:#38bdf8!important;color:#bae6fd!important}
#pad button.on{filter:brightness(1.5);transform:scale(.97)}
#plet{flex:1;min-height:0;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
#plet button{border-radius:16px;border:3px solid #f472b6;background:#2a1c3e;color:#fff;font:900 clamp(26px,7vh,56px) system-ui,sans-serif;padding:0;min-height:0}
@media (orientation:landscape){
 #pad header{flex-direction:row;flex-wrap:wrap;align-items:baseline;gap:4px 14px}
 #pmain{flex-direction:row;justify-content:space-around}
 .dpad{width:min(40vw,64vh)}
 .btns{width:min(40vw,420px)}
 .btns .ok{height:min(30vh,130px)}
 #plet{grid-template-columns:repeat(8,1fr)}
 #plet button{font-size:clamp(24px,9vh,52px)}
}
</style>
