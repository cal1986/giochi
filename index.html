<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Giochi di casa</title>
<style>
:root{--bg:#14121f;--fg:#f6f1e7;--mut:#b6aec8;--card:#221e33;--bd:#3a3452;--acc:#fde047;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 20% 0%,#2b2347 0,var(--bg) 60%);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
 padding-block:max(32px,env(safe-area-inset-top,0px)) 32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{max-width:1000px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
h1{margin:0;font-size:clamp(32px,6vw,56px);letter-spacing:.02em;color:var(--acc);text-wrap:balance}
p.sub{margin:-12px 0 0;color:var(--mut);font-size:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:20px}
a.tile{display:flex;flex-direction:column;gap:8px;padding:26px 22px;border-radius:22px;background:var(--card);border:3px solid var(--bd);color:var(--fg);text-decoration:none;min-width:0;transition:transform .12s,border-color .12s}
a.tile .ico{font-size:64px;line-height:1}
a.tile b{font-size:26px}
a.tile span{color:var(--mut);font-size:15px;line-height:1.4}
a.tile:hover,a.tile:focus-visible{border-color:var(--acc);transform:scale(1.03);outline:none}
</style>
</head>
<body>
<main>
<h1>Giochi di casa</h1>
<p class="sub">Scegli un gioco. Alla TV, i telefoni diventano i joystick.</p>
<div class="grid">
 <a class="tile" href="picchiaduro.html" autofocus><span class="ico">🥊</span><b>Picchiaduro</b><span>Uno contro uno, al meglio dei tre round. Inquadra il codice con il telefono per giocare.</span></a>
 <a class="tile" href="eroe.html"><span class="ico">🎤</span><b>Eroe Cantante</b><span>Fai cantare bene Enrico premendo le frecce a tempo. Da soli o in sfida, con i telefoni come joystick.</span></a>
</div>
</main>
<script>try{document.querySelector("a.tile").focus()}catch(e){}</script>
</body>
</html>
