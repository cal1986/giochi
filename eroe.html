<style>
:root{color-scheme:dark;--bg:#0b0614;--fg:#f4efe6;--pc:#38bdf8}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
#c{display:block;position:absolute;left:0;top:0;background:#000;outline:none}
#pw{position:fixed;left:50%;top:58%;transform:translate(-50%,-50%);background:#1c1730;border:3px solid #f472b6;border-radius:16px;padding:22px 26px;text-align:center;z-index:5;min-width:280px}
#pw[hidden],#pad[hidden],#pick[hidden]{display:none}
#pw h2{margin:0 0 6px;font-size:22px;color:#fde047}
#pw p{margin:0 0 12px;color:#cbd5e1;font-size:15px}
#pw input{font-size:24px;padding:8px 12px;border-radius:10px;border:2px solid #475569;background:#0b0614;color:#fff;width:220px;text-align:center}
#pw button{font-size:20px;margin-left:8px;padding:8px 16px;border-radius:10px;border:0;background:#fde047;color:#0b0614;font-weight:800}
#pwmsg{color:#fca5a5;min-height:1.2em;margin-top:10px;font-size:15px}
/* telefono */
body.padmode #c{display:none}
#pad{position:fixed;left:0;right:0;top:0;bottom:0;display:flex;flex-direction:column;box-sizing:border-box;padding:8px max(12px,env(safe-area-inset-right,0px)) max(10px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));
 touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;background:#100b1e}
#pad.p2{--pc:#fb923c}
#pad header{display:flex;align-items:center;flex-wrap:wrap;gap:6px 12px;margin-bottom:8px}
#pad .who{font-weight:900;font-size:19px;color:var(--pc)}
#pad .me{display:flex;align-items:center;gap:6px;background:#221b38;border:2px solid #3a3058;border-radius:22px;padding:2px 12px 2px 2px;color:#fff;font:700 15px system-ui,sans-serif}
#pad .me canvas{width:40px;height:40px}
#pad .score{font-weight:800;color:#fde047;font-size:16px}
#pad .st{width:100%;font-size:13px;color:#a79fbc}#pad .st.ok{color:#4ade80}
#pad .diag{width:100%;font:11px monospace;color:#6b6585}
#ctl{flex:1;display:flex;flex-direction:column;gap:10px;min-height:0}
.arrows{flex:1;display:flex;gap:10px;min-height:0}
.arrows button{flex:1;min-width:0;border-radius:20px;border:4px solid;background:#1d1830;display:flex;align-items:center;justify-content:center;padding:0}
.arrows svg{width:62%;max-width:120px;height:auto}
.a0{border-color:#a855f7!important;fill:#a855f7}.a1{border-color:#22d3ee!important;fill:#22d3ee}.a2{border-color:#4ade80!important;fill:#4ade80}.a3{border-color:#f43f5e!important;fill:#f43f5e}
.arrows button.on{background:#fff}
.menu{display:flex;gap:10px;height:64px}
.menu button{flex:1;border-radius:16px;border:3px solid #475569;background:#221b38;color:#fff;font:900 22px system-ui,sans-serif}
.menu .ok{flex:2;background:#fde047;color:#0b0614;border-color:#fde047}
.menu button.on{filter:brightness(1.4)}
#pad.playing .menu{display:none}
#pad.inplay .menu{display:flex;height:38px}#pad.inplay .menu .ok{display:none}#pad.inplay .menu .back{font-size:14px;color:#cbd5e1;border-width:2px}
#pick{position:fixed;inset:0;background:rgba(10,6,20,.94);display:flex;align-items:center;justify-content:center;z-index:9;padding:16px}
.pk{background:#1c1730;border:3px solid var(--pc);border-radius:18px;padding:16px;text-align:center;max-width:560px;width:100%;box-sizing:border-box}
.pk h2{margin:0 0 10px;color:#fde047}
#faces{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.face{display:flex;flex-direction:column;align-items:center;gap:4px;background:#221b38;border:2px solid #3a3058;border-radius:14px;padding:8px;color:#fff;font:700 14px system-ui,sans-serif;width:96px}
.face canvas{width:60px;height:60px}
#altrof{margin-top:12px;display:flex;gap:8px;justify-content:center}
#altro{font-size:18px;padding:8px 10px;border-radius:10px;border:2px solid #475569;background:#0b0614;color:#fff;width:60%}
#altrof button,#pickx{font:800 17px system-ui,sans-serif;border-radius:10px;border:0;padding:8px 14px;background:#fde047;color:#0b0614}
#pickx{margin-top:12px;background:#334155;color:#fff}
</style>
